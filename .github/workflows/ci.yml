permissions:
  issues: write
  contents: read
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: |
          set +e
          PYTHONPATH=src python -m pytest tests -q --tb=short > pytest-out.txt 2>&1
          echo "pytest exit: $?" >> pytest-out.txt
          tail -5 pytest-out.txt
          exit 0
      - name: Report failures as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "pytest exit: 0" pytest-out.txt; then echo "suite green on this python"; exit 0; fi
          { echo "CI diag report (python ${{ matrix.python-version }})"; echo; tail -120 pytest-out.txt; } > issue-body.md
          gh issue create --title "CI diag ${{ matrix.python-version }} $(date -u +%FT%TZ)" --body-file issue-body.md || true
      - name: Smoke test CLI
        run: |
          PYTHONPATH=src python -m ghostslice scan . > /dev/null
          PYTHONPATH=src python -m ghostslice check-budget . --max-tokens 100000000
