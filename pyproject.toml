[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostslice"
version = "0.6.0"
description = "Agent context and prompt optimizer: visual token-cost tree, AST slicer, pre-flight cost estimator, .claude_context export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "tokens", "context", "claude-code", "aider", "agents"]
dependencies = []

[project.scripts]
ghostslice = "ghostslice.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostslice = ["dashboard.html", "prices.json"]
